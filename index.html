function fibS(n,r){const p=[],ph=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,rr=Math.sqrt(Math.max(0,1-y*y)),t=ph*i;p.push(new THREE.Vector3(Math.cos(t)*rr*r,y*r,Math.sin(t)*rr*r));}return p;}

function gTex(h){const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),hh=h.replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(hh.slice(i,i+2),16));const gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.18,`rgba(${r},${g},${b},.9)`);gr.addColorStop(.5,`rgba(${r},${g},${b},.25)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(c);}
const wTex=(()=>{const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(220,235,255,.5)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(c);})();

// ── SCENE ────────────────────────────────────────────────────────────────
function iS(){
  rnd=new THREE.WebGLRenderer({antialias:true});rnd.setPixelRatio(CFG.dpr);rnd.setSize(innerWidth,innerHeight);
  rnd.toneMapping=THREE.ACESFilmicToneMapping;rnd.toneMappingExposure=1.05;document.body.appendChild(rnd.domElement);
  scn=new THREE.Scene();scn.background=new THREE.Color(0x05030f);scn.fog=new THREE.FogExp2(0x0a0820,.0016);
  cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,2500);cam.position.copy(CFG.ic);
  scn.add(new THREE.AmbientLight(0x111133,.6));const pt=new THREE.PointLight(0xf5c76b,1,300);pt.position.set(10,60,100);scn.add(pt);
}

function bBg(){
  const n=CFG.bgStars,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=650+Math.random()*700,t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.sin(ph)*Math.sin(t);p[i*3+2]=r*Math.cos(ph);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scn.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.9,sizeAttenuation:true,transparent:true,opacity:.65,blending:THREE.AdditiveBlending,depthWrite:false})));

// === PLANETS ===
(function addPlanets() {
  const ambLight = new THREE.AmbientLight(0x8888cc, 1.5);
  scn.add(ambLight);
  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
  dirLight.position.set(300, 400, 300);
  scn.add(dirLight);

  const planets = [
    {r:28, col:0xf4b48a, x:-320, y:80,  z:-380, ring:false},
    {r:18, col:0xc4a8f5, x:370,  y:-50, z:-460, ring:false},
    {r:42, col:0xd0eaff, x:-480, y:160, z:-580, ring:true},
    {r:14, col:0xf4a0b0, x:250,  y:200, z:-300, ring:false},
    {r:22, col:0xf5c76b, x:-180, y:-160,z:-420, ring:false},
  ];
  planets.forEach(pd => {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(pd.r, 32, 32),
      new THREE.MeshStandardMaterial({color:pd.col, roughness:0.6, metalness:0.1, emissive:pd.col, emissiveIntensity:0.3})
    );
    mesh.position.set(pd.x, pd.y, pd.z);
    scn.add(mesh);
    gsap.to(mesh.rotation, {y: Math.PI*2, duration:20+Math.random()*15, repeat:-1, ease:"none"});

    // Glow halo
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(pd.r*1.25, 32, 32),
      new THREE.MeshBasicMaterial({color:pd.col, transparent:true, opacity:0.07, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false})
    );
    halo.position.copy(mesh.position);
    scn.add(halo);

    // Ring
    if (pd.ring) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(pd.r*1.5, pd.r*2.5, 64),
        new THREE.MeshBasicMaterial({color:0xd0eaff, transparent:true, opacity:0.35, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false})
      );
      ring.position.copy(mesh.position);
      ring.rotation.x = Math.PI/3;
      scn.add(ring);
    }
  });

  // Shooting stars
  function spawnShootingStar() {
    const sx = -500 + Math.random()*1000;
    const sy = 100 + Math.random()*250;
    const sz = -200 - Math.random()*200;
    const len = 100 + Math.random()*150;
    const pts = [new THREE.Vector3(sx,sy,sz), new THREE.Vector3(sx+len, sy-len*0.45, sz)];
    const sg = new THREE.BufferGeometry().setFromPoints(pts);
    const sm = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false});
    const star = new THREE.Line(sg, sm);
    scn.add(star);
    gsap.to(star.position, {x:star.position.x+350, y:star.position.y-140, duration:1+Math.random()*0.8, ease:"power2.in", onComplete:()=>{scn.remove(star);sg.dispose();sm.dispose();}});
    gsap.to(sm, {opacity:0, duration:0.7, delay:0.3, ease:"power2.in"});
  }
  (function loop(){setTimeout(()=>{spawnShootingStar();loop();}, 2000+Math.random()*3500);})();
})();


  

}

function bMs(){
  const cm=new Map();
  memories.forEach(m=>{if(!cm.has(m.chapter))cm.set(m.chapter,{name:m.chapter,color:m.chapterColor,memories:[]});cm.get(m.chapter).memories.push(m);});
  chs=[...cm.values()];cO=fibS(chs.length,CFG.clusterR);
  chs.forEach((ch,ci)=>{
    const or=cO[ci],tx=gTex(ch.color),tc=new THREE.Color(ch.color),sp2=[];
    ch.memories.forEach(mem=>{
      const p=or.clone().add(riS(CFG.starR)),fn=mem.isFinale,bs=fn?12:4.5+rg.next()*2.5;
      const mt=new THREE.SpriteMaterial({map:tx,color:tc,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0});
      const sp=new THREE.Sprite(mt);sp.position.copy(p);sp.scale.setScalar(bs);
      sp.userData={memory:mem,baseScale:bs,phase:rg.next()*Math.PI*2};scn.add(sp);spr.push(sp);sp2.push(p.clone());
      if(fn){const hm=new THREE.SpriteMaterial({map:wTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0});const ha=new THREE.Sprite(hm);ha.position.copy(p);ha.scale.setScalar(26);ha.userData={isHalo:true,phase:rg.next()*Math.PI*2};scn.add(ha);sp.userData.halo=ha;}
    });
    
    ch.origin=or;
    const it=document.createElement('div');it.className='li2';it.innerHTML=`<div class="ld" style="background:${ch.color}"></div>${ch.name}`;it.addEventListener('click',()=>flyC(ci));lgEl.appendChild(it);
  });
}

function sBlm(){
  cmp=new EffectComposer(rnd);cmp.addPass(new RenderPass(scn,cam));
  cmp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),CFG.bloomStr,CFG.bloomRad,CFG.bloomThr));
  cmp.addPass(new OutputPass());
}

function sCt(){
  ctl=new OrbitControls(cam,rnd.domElement);ctl.enableDamping=true;ctl.dampingFactor=.055;ctl.autoRotate=false;
  ctl.autoRotateSpeed=CFG.rotSpd;ctl.enablePan=false;ctl.minDistance=CFG.minZ;ctl.maxDistance=CFG.maxZ;
  ctl.target.set(0,0,0);tLT.set(0,0,0);
}

// ── INTERACTION ──────────────────────────────────────────────────────────
function sInt(){
  const cv=rnd.domElement;
  cv.addEventListener('mousemove',e=>{if(po||iT)return;sM(e.clientX,e.clientY);dH(e.clientX,e.clientY);});
  cv.addEventListener('click',()=>{if(iT){sT();return;}if(po)return;const h=cSp();if(h)oP(h.userData.memory);});
  let ts={x:0,y:0,t:0};
  cv.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};},{passive:true});
  cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.hypot(dx,dy)>14||Date.now()-ts.t>450)return;if(iT){sT();return;}if(po)return;sM(e.changedTouches[0].clientX,e.changedTouches[0].clientY);const h=cSp();if(h)oP(h.userData.memory);},{passive:true});
  pxEl.addEventListener('click',cP);$('pb2').addEventListener('click',cP);
  ppEl.addEventListener('click',()=>nP(-1));pnEl.addEventListener('click',()=>nP(1));
  tbEl.addEventListener('click',()=>iT?sT():stT());mbEl.addEventListener('click',tgM);
  const oc=()=>stMu();document.addEventListener('pointerdown',oc,{once:true});document.addEventListener('touchstart',oc,{once:true});
}

function sM(x,y){ms.x=(x/innerWidth)*2-1;ms.y=-(y/innerHeight)*2+1;}
function cSp(){rc.setFromCamera(ms,cam);const h=rc.intersectObjects(spr.filter(s=>!s.userData.isHalo));return h.length?h[0].object:null;}
function rSc(s){gsap.to(s.scale,{x:s.userData.baseScale,y:s.userData.baseScale,z:s.userData.baseScale,duration:.3,overwrite:true});}
function dH(cx,cy){const h=cSp();if(h&&h!==hov){if(hov)rSc(hov);hov=h;shT(h.userData.memory);gsap.to(h.scale,{x:h.userData.baseScale*1.45,y:h.userData.baseScale*1.45,z:h.userData.baseScale*1.45,duration:.3,overwrite:true});document.body.style.cursor='pointer';}else if(!h&&hov){rSc(hov);hov=null;hdT();document.body.style.cursor='';}if(hov){ttEl.style.left=(cx+15)+'px';ttEl.style.top=(cy-10)+'px';}}
function shT(m){tt1.textContent=m.title;tt2.textContent='';ttEl.classList.add('s');}
function hdT(){ttEl.classList.remove('s');}

// ── PANEL ────────────────────────────────────────────────────────────────
function oP(mem){
  pcm=memories.filter(m=>m.chapter===mem.chapter);pi=pcm.indexOf(mem);
  const sp=spr.find(s=>s.userData.memory===mem);
  if(sp){sCP.copy(cam.position);sCT.copy(ctl.target);const tg=sp.position.clone(),dr=cam.position.clone().sub(tg).normalize().multiplyScalar(52),ds=tg.clone().add(dr);ctl.autoRotate=false;gsap.to(cam.position,{x:ds.x,y:ds.y,z:ds.z,duration:1.4,ease:'power3.inOut'});gsap.to(ctl.target,{x:tg.x,y:tg.y,z:tg.z,duration:1.4,ease:'power3.inOut',onUpdate:()=>ctl.update()});}
  fP(mem);po=true;ctl.enabled=false;hdT();dpEl.classList.add('o');gsap.to(dpEl,{opacity:1,duration:.35,ease:'power2.out'});if(mem.isFinale)bP(sp);
}
function fP(mem){
  pchEl.textContent=mem.chapter;pchEl.style.color=mem.chapterColor;pteEl.textContent=mem.title;pdEl.textContent='';pcaEl.textContent=mem.caption;
  if(mem.isFinale&&mem.finaleText){ptxEl.textContent=mem.finaleText;ptxEl.classList.add('s');}else{ptxEl.classList.remove('s');ptxEl.textContent='';}
  piEl.style.display='none';pvEl.style.display='none';phEl.style.display='flex';pmEl.classList.remove('iv');pvEl.pause();pvEl.src='';
  if(mem.type==='video'){pmEl.classList.add('iv');pvEl.style.display='block';pvEl.src=mem.src;pvEl.play().catch(()=>{});phEl.style.display='none';}
  else{piEl.style.display='block';const im=new Image();im.onload=()=>{piEl.src=mem.src;phEl.style.display='none';};im.onerror=()=>{phEl.style.display='flex';phEl.querySelector('.mpt').textContent='Add: '+mem.src;piEl.style.display='none';};im.src=mem.src;}
  pncEl.textContent=`${pi+1} / ${pcm.length}`;ppEl.disabled=pi===0;pnEl.disabled=pi===pcm.length-1;
}
function nP(d){const n=pi+d;if(n<0||n>=pcm.length)return;pi=n;fP(pcm[pi]);}
function cP(){if(!po)return;po=false;pvEl.pause();pvEl.src='';dpEl.classList.remove('o');gsap.to(dpEl,{opacity:0,duration:.3,ease:'power2.in'});ctl.enabled=true;ctl.autoRotate=true;gsap.to(cam.position,{x:sCP.x,y:sCP.y,z:sCP.z,duration:1.5,ease:'power3.inOut'});gsap.to(ctl.target,{x:sCT.x,y:sCT.y,z:sCT.z,duration:1.5,ease:'power3.inOut',onUpdate:()=>ctl.update()});}

// ── TOUR ─────────────────────────────────────────────────────────────────
function stT(){
  if(po)cP();iT=true;tbEl.textContent='✕ Stop Tour';tbEl.classList.add('a');ctl.enabled=false;ctl.autoRotate=false;tLT.copy(ctl.target);
  const stops=chs.map(ch=>ch.memories[0]),fn=memories.find(m=>m.isFinale);if(fn&&!stops.includes(fn))stops.push(fn);
  const tl=gsap.timeline({onComplete:sT});tTL=tl;
  stops.forEach(mem=>{const sp=spr.find(s=>s.userData.memory===mem);if(!sp)return;const tg=sp.position.clone(),of=new THREE.Vector3(rg.range(-12,12),rg.range(-6,10),55),ds=tg.clone().add(of);tl.to(cam.position,{x:ds.x,y:ds.y,z:ds.z,duration:3.8,ease:'power2.inOut'});tl.to(tLT,{x:tg.x,y:tg.y,z:tg.z,duration:3.8,ease:'power2.inOut'},'<');tl.call(()=>{scEl.textContent=mem.chapter;stEl.textContent=mem.title;gsap.to(ts2El,{opacity:1,duration:.5});});tl.to({},{duration:2.8});tl.call(()=>gsap.to(ts2El,{opacity:0,duration:.4}));tl.to({},{duration:.35});});
}
function sT(){if(!iT)return;iT=false;tbEl.textContent='✦ Take the Tour';tbEl.classList.remove('a');if(tTL){tTL.kill();tTL=null;}gsap.to(ts2El,{opacity:0,duration:.4});ctl.enabled=true;ctl.autoRotate=true;gsap.to(cam.position,{x:CFG.ic.x,y:CFG.ic.y,z:CFG.ic.z,duration:2.2,ease:'power3.inOut'});gsap.to(ctl.target,{x:0,y:0,z:0,duration:2.2,ease:'power3.inOut',onUpdate:()=>ctl.update()});}
function flyC(ci){if(po)cP();const or=cO[ci],ds=or.clone().add(new THREE.Vector3(0,15,70));ctl.autoRotate=false;gsap.to(cam.position,{x:ds.x,y:ds.y,z:ds.z,duration:2.5,ease:'power3.inOut'});gsap.to(ctl.target,{x:or.x,y:or.y,z:or.z,duration:2.5,ease:'power3.inOut',onUpdate:()=>ctl.update(),onComplete:()=>{ctl.autoRotate=true;}});}

// ── PARTICLE BURST ───────────────────────────────────────────────────────
function bP(sp){if(!sp)return;const pos=sp.position,n=IM?40:80,ar=new Float32Array(n*3),ve=[];for(let i=0;i<n;i++){ar[i*3]=pos.x;ar[i*3+1]=pos.y;ar[i*3+2]=pos.z;ve.push(new THREE.Vector3(rg.range(-1,1),rg.range(-1,1),rg.range(-1,1)).normalize().multiplyScalar(rg.range(1.5,5)));}const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.BufferAttribute(ar,3));const mt=new THREE.PointsMaterial({color:0xd0eaff,size:.65,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});const pt=new THREE.Points(ge,mt);scn.add(pt);let t=0;const an=()=>{t+=.02;const a=ge.attributes.position.array;for(let i=0;i<n;i++){a[i*3]+=ve[i].x*.09;a[i*3+1]+=ve[i].y*.09;a[i*3+2]+=ve[i].z*.09;}ge.attributes.position.needsUpdate=true;mt.opacity=Math.max(0,1-t/1.4);if(t<1.4)requestAnimationFrame(an);else{scn.remove(pt);ge.dispose();mt.dispose();}};an();}

// ── SHOOTING STARS ───────────────────────────────────────────────────────
function spSh(){const r=500,t=Math.random()*Math.PI*2,p=Math.acos(Math.random()*.7+.15),s=new THREE.Vector3(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p)),e=s.clone().add(s.clone().negate().normalize().multiplyScalar(rg.range(60,130)));const g=new THREE.BufferGeometry().setFromPoints([s,e]);const m=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});const l=new THREE.Line(g,m);scn.add(l);gsap.to(m,{opacity:.75,duration:.12,ease:'power1.in',onComplete:()=>gsap.to(m,{opacity:0,duration:rg.range(.55,.9),ease:'power1.out',onComplete:()=>{scn.remove(l);g.dispose();m.dispose();}})});}
function schSh(){setTimeout(()=>{spSh();schSh();},rg.range(3.5,11)*1000);}

// ── COUNTER / MUSIC ──────────────────────────────────────────────────────
function uC(){const s=RELATIONSHIP_START;if(isNaN(s.getTime()))return;const d=Date.now()-s.getTime();cvEl.textContent=`${Math.floor(d/86400000)}d ${Math.floor(d%86400000/3600000)}h ${Math.floor(d%3600000/60000)}m`;}
function stMu(){if(mSt)return;mSt=true;mEl.volume=0;mEl.play().catch(()=>{});gsap.to(mEl,{volume:.32,duration:3.5});}
function tgM(){mut=!mut;mEl.muted=mut;mbEl.classList.toggle('m',mut);mbEl.textContent=mut?'✕':'♪';}

// ── RENDER LOOP ──────────────────────────────────────────────────────────
function tick(){
  requestAnimationFrame(tick);const t=clk.getElapsedTime();
  spr.forEach(sp=>{const{baseScale:bs,phase:ph,memory:m,isHalo:ih}=sp.userData;if(ih){sp.material.opacity=.28+.12*Math.sin(t*1.1+(ph||0));sp.scale.setScalar(26+2*Math.sin(t*.8+(ph||0)));return;}const pu=m?.isFinale?bs*(1.1+.18*Math.sin(t*2+ph)):bs*(1+.06*Math.sin(t*1.7+ph));if(hov!==sp)sp.scale.setScalar(pu);});
  if(iT)cam.lookAt(tLT);else ctl.update();
  cmp.render();
}

// ── CINEMATIC ────────────────────────────────────────────────────────────
function rCin(){
  gsap.to(lsEl,{opacity:0,duration:.7,onComplete:()=>{lsEl.style.display='none';}});
  const sorted=[...spr].sort((a,b)=>a.position.length()-b.position.length());
  sorted.forEach((sp,i)=>{const d=.6+i*.05,op=sp.userData.memory?.isFinale?.95:.88;gsap.to(sp.material,{opacity:op,duration:1.8,delay:d,ease:'power2.out'});});
  chs.forEach((ch,i)=>{if(ch.line)gsap.to(ch.line.material,{opacity:.11,duration:2.5,delay:1.2+i*.12,ease:'power1.out'});});
  gsap.delayedCall(.9,()=>gsap.to(tcEl,{opacity:1,duration:1.6,ease:'power2.out'}));
  gsap.delayedCall(4.2,()=>gsap.to(tcEl,{opacity:0,duration:1.3,ease:'power2.in'}));
  gsap.delayedCall(5.5,()=>{hudEl.classList.add('v');lgEl.classList.add('v');gsap.to([hudEl,lgEl,ccEl],{opacity:1,duration:1.3,stagger:.18,ease:'power2.out'});ctl.autoRotate=true;});
}

window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rnd.setSize(innerWidth,innerHeight);cmp.setSize(innerWidth,innerHeight);});

// ── INIT ─────────────────────────────────────────────────────────────────
function init(){
  try{const c=document.createElement('canvas');if(!c.getContext('webgl2')&&!c.getContext('webgl'))throw 0;}catch{$('wf').style.display='flex';lsEl.style.display='none';return;}
  iS();bBg();bMs();sBlm();sCt();sInt();schSh();uC();setInterval(uC,60000);
  let pr=0;const iv=setInterval(()=>{pr=Math.min(pr+Math.random()*7+2,91);pbEl.style.width=pr+'%';},100);
  rnd.setAnimationLoop(()=>{rnd.setAnimationLoop(null);clearInterval(iv);pbEl.style.width='100%';setTimeout(rCin,350);});
  tick();
}
init();


// ── Video sound toggle ───────────────────────────────────────────────────
const vSndBtn = document.getElementById('vid-sound');
vSndBtn.addEventListener('click', () => {
  pvEl.muted = !pvEl.muted;
  vSndBtn.textContent = pvEl.muted ? '🔇' : '🔊';
});


// --- BACKGROUND AUDIO FIX ---
const bgAudio = document.getElementById('mus') || document.getElementById('bg-music');
const muteBtn = document.getElementById('mb') || document.getElementById('mute-btn');
let hasStartedAudio = false;

if (bgAudio) {
  bgAudio.volume = 0.6;
  
  // Play on first interaction
  const startAudio = () => {
    if(!hasStartedAudio && bgAudio.paused) {
      bgAudio.play().catch(e => console.log('Audio blocked', e));
      hasStartedAudio = true;
      if (muteBtn) muteBtn.style.opacity = '1';
    }
  };
  
  document.addEventListener('click', startAudio, {once: true});
  document.addEventListener('touchstart', startAudio, {once: true});
  
  // Mute button logic
  if (muteBtn) {
    // Override any existing onclick just in case
    muteBtn.onclick = (e) => {
      e.stopPropagation();
      hasStartedAudio = true;
      if (bgAudio.paused) {
        bgAudio.play();
        muteBtn.style.opacity = '1';
      } else {
        bgAudio.pause();
        muteBtn.style.opacity = '0.5';
      }
    };
  }
}

</script>
